name: busymark
description: Local-first Markdown and Writerside-compatible documentation editor.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  file_selector: ^1.1.0
  flutter_riverpod: ^2.6.0
  go_router: ^17.3.0
  intl: ^0.20.0
  path: ^1.9.0
  path_provider: ^2.1.0
  system_theme: ^3.3.0
  ubuntu_localizations: ^0.5.2+3
  xml: ^6.5.0
  yaru: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
