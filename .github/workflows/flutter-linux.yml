name: Flutter Linux

on:
  pull_request:
    branches:
      - main
      - release/v0.7.0
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  native-product:
    uses: ./.github/workflows/flutter-linux-native.yml
    with:
      run-stress: false

  writerside-conformance:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate the pinned Writerside compatibility fixture
        run: tools/validate_writerside_conformance.sh

  verify:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        id: linux-dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            apparmor-profiles \
            at-spi2-core \
            bubblewrap \
            clang \
            cmake \
            dbus-daemon \
            gsettings-desktop-schemas \
            dconf-cli \
            fonts-noto-core \
            fonts-noto-cjk \
            fonts-noto-mono \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            libglib2.0-dev \
            libpango1.0-dev \
            libhandy-1-dev \
            libsecret-1-dev libcurl4-openssl-dev libssl-dev libexpat1-dev zlib1g-dev \
            libwebkit2gtk-4.1-dev \
            gir1.2-webkit2-4.1 \
            poppler-utils \
            python3-gi \
            python3-gi-cairo \
            python3-yaml \
            rsync \
            xvfb \
            weston \
            xz-utils

      - name: Enable Bubblewrap sandbox for WebKitGTK tests
        id: web-sandbox
        if: ${{ !cancelled() && steps.linux-dependencies.outcome == 'success' }}
        run: |
          probe_bwrap() {
            bwrap --ro-bind / / --unshare-user --unshare-pid \
              --unshare-net /usr/bin/true
          }
          if ! probe_bwrap; then
            profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
            test -f "$profile"
            sudo install -m 0644 "$profile" \
              /etc/apparmor.d/bwrap-userns-restrict
            sudo apparmor_parser --replace \
              /etc/apparmor.d/bwrap-userns-restrict
          fi
          probe_bwrap

      - name: Set up Node.js for bundled web engines
        id: node
        if: ${{ !cancelled() }}
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/visualization/package-lock.json

      - name: Select official pinned Flutter SDK
        id: flutter-sdk
        if: ${{ !cancelled() }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true

      - name: Enable Linux desktop
        if: ${{ !cancelled() && steps.flutter-sdk.outcome == 'success' }}
        run: flutter config --enable-linux-desktop

      - name: Resolve locked dependencies
        id: flutter-packages
        if: ${{ !cancelled() && steps.flutter-sdk.outcome == 'success' }}
        run: |
          python3 tools/checkout_shared_dependencies.py
          python3 ../busystack_git/tool/build_runtime.py --build-dir "$RUNNER_TEMP/git-native"
          echo "BUSYSTACK_GIT_EXECUTABLE=$RUNNER_TEMP/git-native/git-runtime/bin/git" >> "$GITHUB_ENV"
          echo "BUSYSTACK_TEST_GIT=$RUNNER_TEMP/git-native/git-runtime/bin/git" >> "$GITHUB_ENV"
          echo "BUSYSTACK_TEST_GIT_256=$RUNNER_TEMP/git-native/git-runtime/bin/git" >> "$GITHUB_ENV"
          echo "BUSYSTACK_GIT_HELPER_PATH=$RUNNER_TEMP/git-native/busystack-git-helper" >> "$GITHUB_ENV"
          flutter pub get --enforce-lockfile

      - name: Verify shared Git runtime and engine
        if: ${{ !cancelled() && steps.flutter-packages.outcome == 'success' }}
        working-directory: ../busystack_git
        run: |
          dart pub get --enforce-lockfile
          dart run tool/check_git.dart
          dart test

      - name: Verify shared Git desktop views
        if: ${{ !cancelled() && steps.flutter-packages.outcome == 'success' }}
        working-directory: ../busystack_git_flutter
        run: |
          flutter pub get --enforce-lockfile
          flutter test
          cmake -S linux/native -B "$RUNNER_TEMP/git-accessibility" -G Ninja
          cmake --build "$RUNNER_TEMP/git-accessibility"
          dbus-run-session -- xvfb-run -a ctest --test-dir "$RUNNER_TEMP/git-accessibility" --output-on-failure

      - name: Test production GTK accent lookup and observer
        if: ${{ !cancelled() && steps.linux-dependencies.outcome == 'success' }}
        run: xvfb-run -a env GDK_BACKEND=x11 bash tools/test_gtk_accent.sh

      - name: Test secure credential namespace policy
        if: ${{ !cancelled() && steps.linux-dependencies.outcome == 'success' }}
        run: bash tools/test_secure_credential_policy.sh

      - name: Test native shortcut metadata
        if: ${{ !cancelled() && steps.linux-dependencies.outcome == 'success' }}
        run: xvfb-run -a env GDK_BACKEND=x11 bash tools/test_native_shortcut_metadata.sh

      - name: Generate localizations
        if: ${{ !cancelled() && steps.flutter-packages.outcome == 'success' }}
        run: |
          python3 ../busystack_git_flutter/tool/sync_host_localizations.py \
            --arb lib/l10n/app_en.arb \
            --adapter lib/src/git/application/shared_git_localizations.dart \
            --class-name AppLocalizations \
            --import-uri package:busymark/l10n/generated/app_localizations.dart --check
          flutter gen-l10n

      - name: Audit localization catalogs
        if: ${{ !cancelled() && steps.flutter-packages.outcome == 'success' }}
        run: flutter test test/src/localization_audit_test.dart

      - name: Verify generated files are committed
        if: ${{ !cancelled() && steps.flutter-packages.outcome == 'success' }}
        run: git diff --exit-code

      - name: Check formatting
        if: ${{ !cancelled() && steps.flutter-packages.outcome == 'success' }}
        run: dart format --set-exit-if-changed .

      - name: Analyze
        if: ${{ !cancelled() && steps.flutter-packages.outcome == 'success' }}
        run: flutter analyze

      - name: Test native Hunspell package explicitly
        if: ${{ !cancelled() && steps.flutter-packages.outcome == 'success' && steps.linux-dependencies.outcome == 'success' }}
        working-directory: packages/busymark_spellcheck_native
        run: |
          dart pub get
          dart test

      - name: Prepare all-language spelling test resources
        id: spelling-resources
        if: ${{ !cancelled() && steps.linux-dependencies.outcome == 'success' }}
        run: tools/fetch_spelling_dictionaries.sh build/spelling-test

      - name: Validate every supported dictionary with the native engine
        if: ${{ !cancelled() && steps.spelling-resources.outcome == 'success' && steps.flutter-packages.outcome == 'success' }}
        env:
          BUSYMARK_TEST_SPELLING_ROOT: ${{ github.workspace }}/build/spelling-test
        run: flutter test test/src/spelling_bundle_integration_test.dart

      - name: Build Linux release
        if: ${{ !cancelled() && steps.flutter-packages.outcome == 'success' && steps.linux-dependencies.outcome == 'success' && steps.node.outcome == 'success' }}
        id: release-build
        run: flutter build linux --release

      - name: Test production GTK accent channel host and lifecycle
        if: ${{ !cancelled() && steps.release-build.outcome == 'success' }}
        run: xvfb-run -a env GDK_BACKEND=x11 bash tools/test_gtk_accent_host.sh


      - name: Exercise demand-driven native visualization lifecycle
        if: ${{ !cancelled() && steps.release-build.outcome == 'success' && steps.web-sandbox.outcome == 'success' }}
        run: |
          xvfb-run -a -s '-screen 0 1280x1024x24' \
            env GDK_BACKEND=x11 LIBGL_ALWAYS_SOFTWARE=1 NO_AT_BRIDGE=1 \
            bash tools/test_web_render_host.sh


      - name: Run real WebKit, PlantUML, Mermaid, OpenAPI, and D2 smoke tests
        if: ${{ !cancelled() && steps.release-build.outcome == 'success' && steps.web-sandbox.outcome == 'success' }}
        run: |
          xvfb-run -a -s '-screen 0 1280x1024x24' \
            env GDK_BACKEND=x11 LIBGL_ALWAYS_SOFTWARE=1 \
            /usr/bin/python3 -u tools/visualization_smoke.py \
            --assets build/linux/x64/release/bundle/share/busymark/visualization \
            --d2 build/linux/x64/release/bundle/libexec/busymark/d2 \
            --demo test/fixtures/markdown/basic.md \
            --plantuml-corpus test/fixtures/visualization/plantuml-conformance.md


      - name: Exercise the release binary visualization and PDF paths under X11
        if: ${{ !cancelled() && steps.release-build.outcome == 'success' && steps.web-sandbox.outcome == 'success' }}
        run: |
          report="${RUNNER_TEMP}/visualization-release-x11.json"
          timeout --signal=TERM 300s \
            xvfb-run -a -s '-screen 0 1280x1024x24' \
            env GDK_BACKEND=x11 BUSYMARK_RELEASE_SMOKE=1 \
            XDG_DATA_HOME="${RUNNER_TEMP}/visualization-profile" \
            LIBGL_ALWAYS_SOFTWARE=1 \
            build/linux/x64/release/bundle/busymark \
            --visualization-release-smoke="$report"
          python3 -c 'import json,sys; report=json.load(open(sys.argv[1], encoding="utf-8")); assert report["ok"], report' "$report"
          test -s "${RUNNER_TEMP}/visualization-smoke.pdf"


      - name: Verify release ships catalog and notices without language pairs
        if: ${{ !cancelled() && steps.release-build.outcome == 'success' }}
        run: |
          spelling_root="build/linux/x64/release/bundle/share/busymark/spelling"
          test -s "$spelling_root/dictionaries.json"
          test -s "$spelling_root/NOTICE"
          test -z "$(find "$spelling_root" -type f \( -name '*.aff' -o -name '*.dic' \) -print -quit)"

      - name: Install one dictionary and exercise it after an offline restart
        if: ${{ !cancelled() && steps.release-build.outcome == 'success' }}
        run: |
          report="${RUNNER_TEMP}/spelling-release.json"
          profile="${RUNNER_TEMP}/spelling-profile"
          mkdir -p "$profile"
          xvfb-run -a -s '-screen 0 1280x1024x24' \
            dbus-run-session -- env GDK_BACKEND=x11 BUSYMARK_RELEASE_SMOKE=1 \
            XDG_DATA_HOME="$profile" LIBGL_ALWAYS_SOFTWARE=1 \
            build/linux/x64/release/bundle/busymark \
            --spelling-release-smoke="$report"
          python3 -c 'import json,sys; report=json.load(open(sys.argv[1], encoding="utf-8")); assert report["ok"], report; assert report["checks"]["bundledDictionaryFileCount"] == 0, report; assert report["checks"]["dictionaryInstalledDuringRun"], report; assert report["checks"]["installedDictionaryCount"] == 1, report' "$report"
          sudo unshare --net --fork -- \
            runuser -u "$(id -un)" -- \
            xvfb-run -a -s '-screen 0 1280x1024x24' \
            dbus-run-session -- env GDK_BACKEND=x11 BUSYMARK_RELEASE_SMOKE=1 \
            XDG_DATA_HOME="$profile" LIBGL_ALWAYS_SOFTWARE=1 \
            build/linux/x64/release/bundle/busymark \
            --spelling-release-smoke="$report"
          python3 -c 'import json,sys; report=json.load(open(sys.argv[1], encoding="utf-8")); assert report["ok"], report; assert not report["checks"]["dictionaryInstalledDuringRun"], report; assert report["checks"]["personalWordPresentBeforeRun"], report' "$report"

      - name: Run spelling and visualization smoke tests under Wayland
        if: ${{ !cancelled() && steps.release-build.outcome == 'success' && steps.web-sandbox.outcome == 'success' }}
        run: |
          runtime_dir="/run/user/$(id -u)"
          sudo install -d -m 700 -o "$(id -u)" -g "$(id -g)" "$runtime_dir"
          XDG_RUNTIME_DIR="$runtime_dir" \
            weston --backend=headless-backend.so --socket=wayland-99 \
            --idle-time=0 --log="${RUNNER_TEMP}/weston.log" &
          weston_pid=$!
          trap 'kill "$weston_pid" 2>/dev/null || true; wait "$weston_pid" 2>/dev/null || true' EXIT
          for attempt in {1..40}; do
            if [ -S "$runtime_dir/wayland-99" ]; then
              break
            fi
            if ! kill -0 "$weston_pid" 2>/dev/null; then
              cat "${RUNNER_TEMP}/weston.log"
              exit 1
            fi
            sleep 0.25
          done
          test -S "$runtime_dir/wayland-99"
          export runtime_dir
          checks_failed=0
          bash -euo pipefail <<'SPELLING' || checks_failed=1
          spelling_report="${RUNNER_TEMP}/spelling-release-wayland.json"
          spelling_profile="${RUNNER_TEMP}/spelling-profile"
          sudo unshare --net --fork -- \
            runuser -u "$(id -un)" -- \
            dbus-run-session -- \
            env XDG_RUNTIME_DIR="$runtime_dir" WAYLAND_DISPLAY=wayland-99 \
            XDG_DATA_HOME="$spelling_profile" GDK_BACKEND=wayland \
            BUSYMARK_RELEASE_SMOKE=1 LIBGL_ALWAYS_SOFTWARE=1 \
            build/linux/x64/release/bundle/busymark \
            --spelling-release-smoke="$spelling_report"
          python3 -c 'import json,sys; report=json.load(open(sys.argv[1], encoding="utf-8")); assert report["ok"], report; assert report["checks"]["sourceEditorTransaction"], report; assert report["checks"]["formattedRichEditorTransaction"], report; assert report["checks"]["tableCellEditorTransaction"], report' "$spelling_report"
          SPELLING
          bash -euo pipefail <<'RENDERERS' || checks_failed=1
          dbus-run-session -- env \
            XDG_RUNTIME_DIR="$runtime_dir" WAYLAND_DISPLAY=wayland-99 \
            GDK_BACKEND=wayland LIBGL_ALWAYS_SOFTWARE=1 \
            /usr/bin/python3 -u tools/visualization_smoke.py \
            --assets build/linux/x64/release/bundle/share/busymark/visualization \
            --d2 build/linux/x64/release/bundle/libexec/busymark/d2 \
            --demo test/fixtures/markdown/basic.md \
            --plantuml-corpus test/fixtures/visualization/plantuml-conformance.md
          RENDERERS
          bash -euo pipefail <<'COMPILED' || checks_failed=1
          report="${RUNNER_TEMP}/visualization-release-wayland.json"
          dbus-run-session -- env \
            XDG_RUNTIME_DIR="$runtime_dir" WAYLAND_DISPLAY=wayland-99 \
            GDK_BACKEND=wayland BUSYMARK_RELEASE_SMOKE=1 \
            LIBGL_ALWAYS_SOFTWARE=1 \
            timeout --signal=TERM 300s \
            build/linux/x64/release/bundle/busymark \
            --visualization-release-smoke="$report"
          python3 -c 'import json,sys; report=json.load(open(sys.argv[1], encoding="utf-8")); assert report["ok"], report' "$report"
          test -s "${RUNNER_TEMP}/visualization-smoke.pdf"
          COMPILED
          exit "$checks_failed"

      # Independent application checks retain their own failure outcomes.
      - name: Test process ownership and application lifecycle tooling
        if: ${{ !cancelled() && steps.linux-dependencies.outcome == 'success' }}
        run: |
          /usr/bin/python3 -m unittest tools/test_owned_processes.py \
            tools/test_application_close_smoke.py \
            tools/test_run_owned_fixture.py \
            tools/test_official_flutter_workflow.py \
            tools/test_visualization_dependency_policy.py

      - name: Test including bundled D2 and Typst paths
        if: ${{ !cancelled() && steps.release-build.outcome == 'success' }}
        env:
          BUSYMARK_D2_PATH: ${{ github.workspace }}/build/linux/x64/release/bundle/libexec/busymark/d2
          BUSYMARK_TYPST_PATH: ${{ github.workspace }}/build/linux/x64/release/bundle/libexec/busymark/typst
        # Real durable fixtures share the runner's filesystem. Keep the full
        # suite bounded independently of a developer machine's CPU count.
        run: flutter test --concurrency=2

      - name: Preserve compiled visualization report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visualization-release
          path: |
            ${{ runner.temp }}/visualization-release-x11.json
            ${{ runner.temp }}/visualization-smoke.pdf
          if-no-files-found: ignore
