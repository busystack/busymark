name: busymark
title: BusyMark
version: "0.6.3"
summary: Markdown and Writerside documentation editor
# Snap Store listing translations are managed outside this Flutter package.
# Update store metadata when approved translated listing text is supplied.
description: |
  BusyMark is a Linux desktop editor for Markdown files and Writerside-compatible documentation projects.

  Open individual Markdown files, documentation folders, and Writerside-style project structures. Edit local files, preview Markdown, navigate project files, inspect document outlines, and save changes in a native-feeling Linux desktop workspace.

  Connect Nextcloud Notes remote workspaces with offline-safe synchronization, categories, favorites, and attachments.

license: Apache-2.0
base: core24
grade: stable
confinement: strict
icon: assets/branding/busymark_logo.svg
website: https://github.com/busystack/busymark
issues: https://github.com/busystack/busymark/issues
contact: https://github.com/busystack/busymark/issues
source-code: https://github.com/busystack/busymark

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]

plugs:
  browser-support:
    interface: browser-support
    allow-sandbox: false

apps:
  busymark:
    command: busymark
    desktop: share/applications/io.busystack.busymark.desktop
    common-id: io.busystack.busymark
    extensions: [gnome]
    plugs:
      - desktop
      - desktop-legacy
      - browser-support
      - audio-playback
      - gsettings
      - opengl
      - wayland
      - x11
      - home
      - network
      - removable-media
      - ssh-keys
      - password-manager-service
    environment:
      GDK_BACKEND: wayland,x11
      TYPST_FONT_PATHS: $SNAP/usr/share/fonts
      XDG_CACHE_HOME: $SNAP_USER_DATA/.cache
      XDG_CONFIG_HOME: $SNAP_USER_DATA/.config
      XDG_DATA_HOME: $SNAP_USER_DATA/.local/share
      BUSYMARK_SPELLING_INSTALL_ROOT: $SNAP_USER_COMMON/spelling/dictionaries

parts:
  flutter-engine:
    plugin: nil
    source: tools/flutter_engine
    build-packages:
      - binutils
      - git
      - curl
      - python3
      - clang
      - ninja-build
      - pkg-config
      - libgtk-3-dev
      - libepoxy-dev
      - unzip
      - xz-utils
    override-build: |
      export BUSYMARK_ENGINE_CACHE="$CRAFT_PART_BUILD/cache"
      engine_archive="$CRAFT_PROJECT_DIR/.build/engine-release.tar.xz"
      if [ -f "$engine_archive" ]; then
        python3 engine.py prepare --framework-only
        python3 engine.py import "$engine_archive"
      else
        python3 engine.py prepare
        python3 engine.py build --mode release --jobs 4
      fi
      python3 engine.py verify --mode release
      engine_key="$(python3 engine.py key)"
      mkdir -p "$CRAFT_PART_INSTALL/flutter-engine/$engine_key"
      cp -a "$BUSYMARK_ENGINE_CACHE/$engine_key/sdk" \
        "$BUSYMARK_ENGINE_CACHE/$engine_key/artifacts" \
        "$BUSYMARK_ENGINE_CACHE/$engine_key/symbols" \
        "$CRAFT_PART_INSTALL/flutter-engine/$engine_key/"
    prime:
      - '-*'

  flutter-runtime:
    after: [flutter-engine]
    plugin: nil
    build-attributes: [no-patchelf]
    override-build: |
      # The reviewed engine already has RUNPATH=$ORIGIN. Snapcraft's ELF
      # rewriting changes its GNU note alignment and breaks symbol matching.
      engine_key="$(python3 "$CRAFT_PROJECT_DIR/tools/flutter_engine/engine.py" key)"
      install -Dm755 \
        "$CRAFT_STAGE/flutter-engine/$engine_key/artifacts/engine/src/out/host_release/libflutter_linux_gtk.so" \
        "$CRAFT_PART_INSTALL/lib/libflutter_linux_gtk.so"

  busymark:
    after: [flutter-runtime]
    plugin: nil
    build-attributes:
      - enable-patchelf
    source: .
    override-pull: |
      # Generated state may contain an entire private engine checkout. Pull only
      # application inputs; the verified archive is read from PROJECT_DIR by
      # the engine part, not copied into the application part.
      rsync -a --delete \
        --exclude=/.git/ --exclude=/.build/ --exclude=/.dart_tool/ \
        --exclude=/build/ --exclude=/linux/flutter/ephemeral/ \
        --exclude=/.craft/ --exclude=/parts/ --exclude=/stage/ --exclude=/prime/ \
        --exclude='/*.snap' \
        "$CRAFT_PROJECT_DIR/" "$CRAFT_PART_SRC/"
    build-snaps:
      - node/24/stable
    build-packages:
      - rsync
      - fonts-noto-core
      - fonts-noto-mono
      - curl
      - libhandy-1-dev
      - libglib2.0-dev
      - libpango1.0-dev
      - libsecret-1-dev
      - libwebkit2gtk-4.1-dev
      - xz-utils
    stage-packages:
      - gstreamer1.0-libav
      - gstreamer1.0-plugins-bad
      - gstreamer1.0-plugins-ugly
      - git
      - fonts-noto-core
      - fonts-noto-mono
      - openssh-client
      - util-linux
      - yaru-theme-gtk
      - yaru-theme-icon
    override-build: |
      rm -rf "$CRAFT_PART_BUILD/build"
      rm -rf "$CRAFT_PART_BUILD/.dart_tool"
      rm -rf "$CRAFT_PART_BUILD/linux/flutter/ephemeral"
      export BUSYMARK_ENGINE_CACHE="$CRAFT_STAGE/flutter-engine"
      export CI=true
      python3 tools/flutter.py pub get --enforce-lockfile
      python3 tools/flutter.py build linux --release --no-pub --verbose \
        --target lib/main.dart
      cp -r build/linux/*/release/bundle/* "$CRAFT_PART_INSTALL/"
      # The byte-identical, verified engine belongs to flutter-runtime so only
      # the application/plugins receive Snapcraft's runtime path adjustments.
      rm "$CRAFT_PART_INSTALL/lib/libflutter_linux_gtk.so"

      # Normalize owned resources before staging so incremental clean/rebuild
      # tracks these symlinks, rather than leaving untracked prime aliases.
      # CMake installs the deterministic Typst font set at the bundle-relative
      # path used by the application. The same files are staged for fontconfig;
      # require them to be identical before consolidating the bundle copy.
      for bundled_font in "$CRAFT_PART_INSTALL/share/busymark/fonts"/Noto*.ttf; do
        staged_font="$CRAFT_PART_INSTALL/usr/share/fonts/truetype/noto/${bundled_font##*/}"
        test -f "$staged_font"
        cmp -s "$bundled_font" "$staged_font"
      done
      rm -rf "$CRAFT_PART_INSTALL/share/busymark/fonts"
      ln -s ../../usr/share/fonts/truetype/noto \
        "$CRAFT_PART_INSTALL/share/busymark/fonts"

      # BusyMark checks both standard XDG roots for user-selected Yaru variants.
      # Preserve both lookup paths without storing a second copy of each theme.
      mkdir -p "$CRAFT_PART_INSTALL/share/themes" "$CRAFT_PART_INSTALL/share/icons"
      for resource_kind in themes icons; do
        for staged_resource in \
          "$CRAFT_PART_INSTALL/usr/share/$resource_kind"/Yaru*; do
          test -e "$staged_resource"
          resource_name="${staged_resource##*/}"
          linked_resource="$CRAFT_PART_INSTALL/share/$resource_kind/$resource_name"
          rm -rf "$linked_resource"
          ln -s "../../usr/share/$resource_kind/$resource_name" \
            "$linked_resource"
        done
      done

  desktop-integration:
    after: [busymark]
    plugin: nil
    build-packages:
      - patchelf
    override-prime: |
      craftctl default
      # Snapcraft's ELF patcher uses RPATH, which takes precedence over the
      # GNOME/Mesa launcher's library selection. Preserve the patched paths as
      # RUNPATH so the connected platform supplies its matching shared runtime.
      for bundled_elf in "$CRAFT_PRIME/busymark" "$CRAFT_PRIME/lib"/*.so; do
        case "$bundled_elf" in
          */libflutter_linux_gtk.so) continue ;;
        esac
        existing_rpath="$(patchelf --print-rpath "$bundled_elf")"
        if [ -n "$existing_rpath" ]; then
          patchelf --set-rpath "$existing_rpath" "$bundled_elf"
        fi
      done
      # The retained codec packages depend on GNOME/GStreamer packages already
      # supplied by the connected platform. Remove only the revision-validated
      # package-owned paths; a missing path signals that this audit is stale.
      while IFS= read -r runtime_path; do
        case "$runtime_path" in
          ""|\#*) continue ;;
        esac
        private_path="$CRAFT_PRIME/$runtime_path"
        if [ ! -e "$private_path" ] && [ ! -L "$private_path" ]; then
          echo "missing audited GNOME runtime duplicate: $runtime_path" >&2
          exit 1
        fi
        rm -f "$private_path"
      done < \
        "$CRAFT_PROJECT_DIR/snap/gnome-46-2404-prime-exclusions.amd64"

      # Keep the library's own directory alongside its two BLAS siblings.
      patchelf --set-rpath \
        '$ORIGIN/lapack:$ORIGIN/blas:$ORIGIN:/snap/core24/current/lib/x86_64-linux-gnu' \
        "$CRAFT_PRIME/usr/lib/x86_64-linux-gnu/libsphinxbase.so.3.0.0"
      # libcaca's optional OpenGL backend is unused and pulls in GLUT/GLU.
      rm -f \
        "$CRAFT_PRIME/usr/lib/x86_64-linux-gnu/caca/libgl_plugin.so" \
        "$CRAFT_PRIME/usr/lib/x86_64-linux-gnu/caca/libgl_plugin.so.0" \
        "$CRAFT_PRIME/usr/lib/x86_64-linux-gnu/caca/libgl_plugin.so.0.0.0"
      # GStreamer stages the core24 librsvg, but the GNOME runtime supplies
      # the matching SVG pixbuf loader and a newer librsvg. Let that pair stay
      # together; otherwise every SVG-backed GTK symbolic icon fails to load.
      rm -f "$CRAFT_PRIME/usr/lib/x86_64-linux-gnu/librsvg-2.so.2"*

      install -Dm644 "$CRAFT_PROJECT_DIR/linux/io.busystack.busymark.desktop" \
        "$CRAFT_PRIME/share/applications/io.busystack.busymark.desktop"
      install -Dm644 "$CRAFT_PROJECT_DIR/assets/branding/busymark_logo.svg" \
        "$CRAFT_PRIME/meta/gui/io.busystack.busymark.svg"
      install -Dm644 "$CRAFT_PROJECT_DIR/assets/branding/busymark_logo.svg" \
        "$CRAFT_PRIME/meta/gui/icon.svg"
      install -Dm644 "$CRAFT_PROJECT_DIR/linux/io.busystack.busymark.metainfo.xml" \
        "$CRAFT_PRIME/share/metainfo/io.busystack.busymark.metainfo.xml"
      install -Dm644 "$CRAFT_PROJECT_DIR/assets/branding/busymark_logo.svg" \
        "$CRAFT_PRIME/share/icons/hicolor/scalable/apps/io.busystack.busymark.svg"

      # The GNOME launcher otherwise regenerates every bundled theme cache in
      # each fresh profile. These are portable indices of packaged icons;
      # generate and validate them with the existing GNOME SDK at build time.
      icon_cache_tool=/snap/gnome-46-2404-sdk/current/usr/bin/gtk-update-icon-cache
      test -x "$icon_cache_tool"
      for icon_theme in \
        "$CRAFT_PRIME"/usr/share/icons/* "$CRAFT_PRIME"/share/icons/*; do
        if [ -f "$icon_theme/index.theme" ]; then
          if [ ! -f "$icon_theme/icon-theme.cache" ]; then
            "$icon_cache_tool" --force --quiet "$icon_theme"
          fi
          # Empty inherited themes contain no icons and emit no cache.
          if [ -f "$icon_theme/icon-theme.cache" ]; then
            "$icon_cache_tool" --validate "$icon_theme"
          fi
        fi
      done
      test -s "$CRAFT_PRIME/usr/share/icons/Yaru/icon-theme.cache"

      # The engine and ICU must remain byte-identical to verified C6 inputs.
      BUSYMARK_ENGINE_CACHE="$CRAFT_STAGE/flutter-engine" \
        python3 "$CRAFT_PROJECT_DIR/tools/flutter_engine/engine.py" check-bundle \
        --mode release --bundle "$CRAFT_PRIME"
