name: busymark
title: BusyMark
version: "0.5.1"
summary: Markdown and Writerside documentation editor
# Snap Store listing translations are managed outside this Flutter package.
# Update store metadata when approved translated listing text is supplied.
description: |
  BusyMark is a Linux desktop editor for Markdown files and Writerside-compatible documentation projects.

  Open individual Markdown files, documentation folders, and Writerside-style project structures. Edit local files, preview Markdown, navigate project files, inspect document outlines, and save changes in a native-feeling Linux desktop workspace.

license: Apache-2.0
base: core24
grade: stable
confinement: strict
icon: assets/branding/busymark_logo.svg
website: https://github.com/busystack/busymark
issues: https://github.com/busystack/busymark/issues
contact: https://github.com/busystack/busymark/issues
source-code: https://github.com/busystack/busymark

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]

plugs:
  browser-support:
    interface: browser-support
    allow-sandbox: false

apps:
  busymark:
    command: busymark
    desktop: share/applications/io.busystack.busymark.desktop
    common-id: io.busystack.busymark
    extensions: [gnome]
    plugs:
      - desktop
      - desktop-legacy
      - browser-support
      - audio-playback
      - gsettings
      - opengl
      - wayland
      - x11
      - home
      - network
      - removable-media
      - ssh-keys
    environment:
      GDK_BACKEND: wayland,x11
      TYPST_FONT_PATHS: $SNAP/usr/share/fonts
      XDG_CACHE_HOME: $SNAP_USER_DATA/.cache
      XDG_CONFIG_HOME: $SNAP_USER_DATA/.config
      XDG_DATA_HOME: $SNAP_USER_DATA/.local/share
      BUSYMARK_SPELLING_INSTALL_ROOT: $SNAP_USER_COMMON/spelling/dictionaries

parts:
  busymark:
    plugin: flutter
    build-attributes:
      - enable-patchelf
    source: .
    flutter-target: lib/main.dart
    flutter-channel: stable
    build-environment:
      - BUSYMARK_FLUTTER_VERSION: "3.47.5"
    build-snaps:
      - node/24/stable
    build-packages:
      - fonts-noto-core
      - fonts-noto-mono
      - curl
      - libhandy-1-dev
      - libglib2.0-dev
      - libpango1.0-dev
      - libsecret-1-dev
      - libwebkit2gtk-4.1-dev
      - xz-utils
    stage-packages:
      - gstreamer1.0-libav
      - gstreamer1.0-plugins-bad
      - gstreamer1.0-plugins-ugly
      - git
      - fonts-noto-core
      - fonts-noto-mono
      - openssh-client
      - util-linux
      - yaru-theme-gtk
      - yaru-theme-icon
    override-build: |
      rm -rf "$CRAFT_PART_BUILD/build"
      rm -rf "$CRAFT_PART_BUILD/.dart_tool"
      rm -rf "$CRAFT_PART_BUILD/linux/flutter/ephemeral"
      flutter_sdk="$CRAFT_PART_BUILD/flutter-distro"
      flutter_sdk_version="$(git -C "$flutter_sdk" describe --tags --exact-match HEAD 2>/dev/null || true)"
      if [ ! -x "$flutter_sdk/bin/flutter" ] || \
          [ "$flutter_sdk_version" != "$BUSYMARK_FLUTTER_VERSION" ]; then
        rm -rf "$flutter_sdk"
        git clone --depth 1 --branch "$BUSYMARK_FLUTTER_VERSION" \
          https://github.com/flutter/flutter.git "$flutter_sdk"
      fi
      test "$(git -C "$flutter_sdk" describe --tags --exact-match HEAD)" = \
        "$BUSYMARK_FLUTTER_VERSION"
      export CI=true
      "$flutter_sdk/bin/flutter" --no-version-check precache --linux
      "$flutter_sdk/bin/flutter" --no-version-check pub get
      "$flutter_sdk/bin/flutter" --no-version-check build linux --release --verbose \
        --target lib/main.dart
      cp -r build/linux/*/release/bundle/* "$CRAFT_PART_INSTALL/"

  desktop-integration:
    after: [busymark]
    plugin: nil
    build-packages:
      - patchelf
    override-prime: |
      craftctl default
      # The retained codec packages depend on GNOME/GStreamer packages already
      # supplied by the connected platform. Remove only the revision-validated
      # package-owned paths; a missing path signals that this audit is stale.
      while IFS= read -r runtime_path; do
        case "$runtime_path" in
          ""|\#*) continue ;;
        esac
        private_path="$CRAFT_PRIME/$runtime_path"
        if [ ! -e "$private_path" ] && [ ! -L "$private_path" ]; then
          echo "missing audited GNOME runtime duplicate: $runtime_path" >&2
          exit 1
        fi
        rm -f "$private_path"
      done < \
        "$CRAFT_PROJECT_DIR/snap/gnome-46-2404-prime-exclusions.amd64"

      # Keep the library's own directory alongside its two BLAS siblings.
      patchelf --set-rpath \
        '$ORIGIN/lapack:$ORIGIN/blas:$ORIGIN:/snap/core24/current/lib/x86_64-linux-gnu' \
        "$CRAFT_PRIME/usr/lib/x86_64-linux-gnu/libsphinxbase.so.3.0.0"
      # libcaca's optional OpenGL backend is unused and pulls in GLUT/GLU.
      rm -f \
        "$CRAFT_PRIME/usr/lib/x86_64-linux-gnu/caca/libgl_plugin.so" \
        "$CRAFT_PRIME/usr/lib/x86_64-linux-gnu/caca/libgl_plugin.so.0" \
        "$CRAFT_PRIME/usr/lib/x86_64-linux-gnu/caca/libgl_plugin.so.0.0.0"
      # GStreamer stages the core24 librsvg, but the GNOME runtime supplies
      # the matching SVG pixbuf loader and a newer librsvg. Let that pair stay
      # together; otherwise every SVG-backed GTK symbolic icon fails to load.
      rm -f "$CRAFT_PRIME/usr/lib/x86_64-linux-gnu/librsvg-2.so.2"*

      # CMake installs the deterministic Typst font set at the bundle-relative
      # path used by the application. The same files are staged for fontconfig;
      # require them to be identical before consolidating the bundle copy.
      for bundled_font in "$CRAFT_PRIME/share/busymark/fonts"/Noto*.ttf; do
        staged_font="$CRAFT_PRIME/usr/share/fonts/truetype/noto/${bundled_font##*/}"
        test -f "$staged_font"
        cmp -s "$bundled_font" "$staged_font"
      done
      rm -rf "$CRAFT_PRIME/share/busymark/fonts"
      ln -s ../../usr/share/fonts/truetype/noto \
        "$CRAFT_PRIME/share/busymark/fonts"

      # BusyMark checks both standard XDG roots for user-selected Yaru variants.
      # Preserve both lookup paths without storing a second copy of each theme.
      mkdir -p "$CRAFT_PRIME/share/themes" "$CRAFT_PRIME/share/icons"
      for resource_kind in themes icons; do
        for staged_resource in \
          "$CRAFT_PRIME/usr/share/$resource_kind"/Yaru*; do
          test -e "$staged_resource"
          resource_name="${staged_resource##*/}"
          linked_resource="$CRAFT_PRIME/share/$resource_kind/$resource_name"
          rm -rf "$linked_resource"
          ln -s "../../usr/share/$resource_kind/$resource_name" \
            "$linked_resource"
        done
      done
      install -Dm644 "$CRAFT_PROJECT_DIR/linux/io.busystack.busymark.desktop" \
        "$CRAFT_PRIME/share/applications/io.busystack.busymark.desktop"
      install -Dm644 "$CRAFT_PROJECT_DIR/assets/branding/busymark_logo.svg" \
        "$CRAFT_PRIME/meta/gui/io.busystack.busymark.svg"
      install -Dm644 "$CRAFT_PROJECT_DIR/assets/branding/busymark_logo.svg" \
        "$CRAFT_PRIME/meta/gui/icon.svg"
      install -Dm644 "$CRAFT_PROJECT_DIR/linux/io.busystack.busymark.metainfo.xml" \
        "$CRAFT_PRIME/share/metainfo/io.busystack.busymark.metainfo.xml"
      install -Dm644 "$CRAFT_PROJECT_DIR/assets/branding/busymark_logo.svg" \
        "$CRAFT_PRIME/share/icons/hicolor/scalable/apps/io.busystack.busymark.svg"
